<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blade - Pet Virtual</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <header>
      <div>
        <small>🐾 Criado por Agatha • 3º ano</small>
        <h1>🐶 Blade</h1>
        <p>Cuide do seu melhor amigo!</p>
      </div>

      <div class="points">
        ⭐ <span id="stars">0</span>
        💰 <span id="coins">0</span>
      </div>
    </header>

    <section class="room">

      <div class="window">
        ☀️
      </div>

      <div class="poster">
        🐶<br>
        <b>BLADE</b>
      </div>

      <div class="bed">
        💤
      </div>

      <div class="rug"></div>

      <div class="dog-area">

        <div id="dog" class="dog">

          <div class="ear left"></div>
          <div class="ear right"></div>

          <div class="head">
            <div class="spot"></div>

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="snout">
              <div class="nose">●</div>
              <div>⌣</div>
            </div>
          </div>

          <div class="body">
            <div class="body-spot"></div>
          </div>

          <div class="leg leg1"></div>
          <div class="leg leg2"></div>
          <div class="leg leg3"></div>
          <div class="leg leg4"></div>

          <div class="tail">〰</div>

        </div>

        <div id="bubble" class="bubble">
          Oi! Eu sou o Blade! 🐶
        </div>

      </div>

    </section>

    <section class="status">

      <h2>Como o Blade está?</h2>

      <div class="mood" id="mood">
        😊 Feliz
      </div>

      <div class="meter">
        <span>🍖 Fome</span>
        <div class="bar">
          <div id="hunger"></div>
        </div>
        <b id="hungerText">80</b>
      </div>

      <div class="meter">
        <span>💧 Sede</span>
        <div class="bar">
          <div id="thirst"></div>
        </div>
        <b id="thirstText">80</b>
      </div>

      <div class="meter">
        <span>🧼 Limpeza</span>
        <div class="bar">
          <div id="clean"></div>
        </div>
        <b id="cleanText">70</b>
      </div>

      <div class="meter">
        <span>❤️ Alegria</span>
        <div class="bar">
          <div id="fun"></div>
        </div>
        <b id="funText">80</b>
      </div>

      <div class="meter">
        <span>😴 Energia</span>
        <div class="bar">
          <div id="energy"></div>
        </div>
        <b id="energyText">80</b>
      </div>

    </section>

    <section class="actions">

      <h2>🐾 O que vamos fazer?</h2>

      <div class="buttons">

        <button onclick="doAction('yard')">
          🌳
          <span>Brincar no quintal</span>
        </button>

        <button onclick="doAction('walk')">
          🦮
          <span>Passear</span>
        </button>

        <button onclick="doAction('food')">
          🍖
          <span>Dar ração</span>
        </button>

        <button onclick="doAction('water')">
          💧
          <span>Dar água</span>
        </button>

        <button onclick="doAction('bath')">
          🛁
          <span>Dar banho</span>
        </button>

        <button onclick="doAction('sleep')">
          🛏️
          <span>Dormir</span>
        </button>

        <button onclick="doAction('teeth')">
          🪥
          <span>Escovar dentes</span>
        </button>

        <button onclick="doAction('brush')">
          🧴
          <span>Escovar pelo</span>
        </button>

      </div>

    </section>

    <footer>
      🐾 Blade — Um jogo criado por Agatha 💙
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
